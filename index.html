const ALLOWED_EMAIL = "salarshahh290@gmail.com";

let products = {};
let sales = {};

let cart = [];

let editProductId = null;
let unsubscribeFns = [];

const $ = id => document.getElementById(id);
const esc = v => String(v ?? "").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
const money = n => `${esc(settings.currency || "Rs")} ${Number(n||0).toLocaleString()}`;
const fmtDate = ts => ts ? new Date(ts).toLocaleString() : "-";

function toast(msg,type="ok"){
  const d=document.createElement("div");
  d.className=`fixed right-4 top-4 z-[100] rounded-xl px-4 py-3 shadow-lg text-white ${type==="err"?"bg-red-600":"bg-emerald-600"}`;
  d.textContent=msg; document.body.appendChild(d); setTimeout(()=>d.remove(),2800);
}
function emptyState(title,text){
  return `<div class="py-12 text-center text-slate-500"><div class="text-4xl mb-2">📦</div><div class="font-semibold text-lg">${esc(title)}</div><div class="text-sm mt-1">${esc(text)}</div></div>`;
}
function totals(){
  const subtotal=cart.reduce((s,i)=>s+i.price*i.qty,0);
  const discount=Number($("discount")?.value||0);
  const tax=Number($("tax")?.value||0);
  const taxAmt=Math.max(0,(subtotal-discount)*tax/100);
  return {subtotal,discount,tax,taxAmt,total:Math.max(0,subtotal-discount+taxAmt)};
}

  $("app").innerHTML=`

      <div class="text-center mb-7">

        <p class="text-slate-500 mt-1">Secure admin point of sale</p>

      </div>
      <label class="text-sm font-semibold">Admin Email</label>

      <input id="password" type="password" placeholder="Firebase password" class="w-full mt-2 border rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-indigo-500">
      <button id="loginBtn" class="w-full mt-5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl py-3">Login to POS</button>

      <div class="p-5 border-b border-slate-800">

      </header>

function navHTML(mobile=false){
  const items=[
    ["dashboard","📊","Dashboard"],["pos","🛒","Sales / POS"],["products","📦","Products"],["sales","🧾","Sales History"],["customers","👥","Customers"],["reports","📈","Reports"],["settings","⚙️","Settings"]
  ];
  return items.map(([id,ic,name])=>`<button data-nav="${id}" class="w-full text-left px-3 py-3 rounded-xl ${currentPage===id?"bg-indigo-600":"hover:bg-slate-800"} ${mobile?"text-slate-800 hover:bg-slate-200":"text-white"}">${ic} <span class="ml-2">${name}</span></button>`).join("");
}
function renderNav(){
  const nav=$("sideNav"); if(nav) nav.innerHTML=navHTML();
  document.querySelectorAll("[data-nav]").forEach(b=>b.onclick=()=>{currentPage=b.dataset.nav;$("mobileNav")?.classList.add("hidden");renderNav();renderPage()});
}
function renderPage(){
  const titles={dashboard:"Dashboard",pos:"Sales / POS",products:"Products & Inventory",sales:"Sales History",customers:"Customers",reports:"Reports",settings:"Settings"};
  $("pageTitle").textContent=titles[currentPage]||"Dashboard";
  const c=$("content");
  if(currentPage==="dashboard") c.innerHTML=dashboardHTML();
  if(currentPage==="pos") c.innerHTML=posHTML();
  if(currentPage==="products") c.innerHTML=productsHTML();
  if(currentPage==="sales") c.innerHTML=salesHTML();
  if(currentPage==="customers") c.innerHTML=customersHTML();
  if(currentPage==="reports") c.innerHTML=reportsHTML();
  if(currentPage==="settings") c.innerHTML=settingsHTML();
  bindPage();
}

function dashboardHTML(){
  const arr=Object.values(sales), today=new Date().toDateString();
  const todaySales=arr.filter(s=>new Date(s.timestamp||0).toDateString()===today);
  const revenue=todaySales.reduce((a,s)=>a+Number(s.total||0),0);
  const low=Object.values(products).filter(p=>Number(p.stock||0)<=Number(p.lowStock||5));
  return `<div class="space-y-5">
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-3">
      ${card("Today's Sales",money(revenue),"🧾")}
      ${card("Orders",todaySales.length,"🛍️")}
      ${card("Products",Object.keys(products).length,"📦")}
      ${card("Low Stock",low.length,"⚠️")}
    </div>
    <div class="grid lg:grid-cols-2 gap-5">
      <div class="bg-white rounded-2xl border p-5"><div class="flex justify-between"><h2 class="font-bold text-lg">Low Stock</h2><button data-nav="products" class="text-indigo-600 text-sm">Manage</button></div>
      ${low.length?`<div class="mt-4 space-y-2">${low.slice(0,8).map(p=>`<div class="flex justify-between border-b py-2"><span>${esc(p.name)}</span><span class="font-bold text-red-600">${Number(p.stock||0)}</span></div>`).join("")}</div>`:emptyState("Stock looks good","No low-stock products.")}</div>
      <div class="bg-white rounded-2xl border p-5"><h2 class="font-bold text-lg">Recent Sales</h2>
      ${arr.length?`<div class="mt-4 space-y-2">${arr.sort((a,b)=>(b.timestamp||0)-(a.timestamp||0)).slice(0,7).map(s=>`<div class="flex justify-between border-b py-2"><div><div class="font-semibold">${esc(s.invoiceNo||s.id)}</div><div class="text-xs text-slate-500">${fmtDate(s.timestamp)}</div></div><b>${money(s.total)}</b></div>`).join("")}</div>`:emptyState("No sales yet","Complete your first sale from POS.")}</div>
    </div>
  </div>`;
}
function card(title,value,icon){return `<div class="bg-white rounded-2xl border p-4"><div class="text-2xl">${icon}</div><div class="text-xs text-slate-500 mt-2">${title}</div><div class="text-xl md:text-2xl font-bold mt-1">${value}</div></div>`}

function posHTML(){
  const subtotal=cart.reduce((s,i)=>s+i.price*i.qty,0);
  return `<div class="grid xl:grid-cols-[1.4fr_.9fr] gap-5">
    <div class="bg-white border rounded-2xl p-4">
      <div class="flex flex-col sm:flex-row gap-2">
        <input id="productSearch" autofocus placeholder="Scan barcode / enter Product ID / search name..." class="flex-1 border rounded-xl px-4 py-3">
        <button id="scanAdd" class="bg-indigo-600 text-white rounded-xl px-5 py-3 font-semibold">Add</button>
      </div>
      <div id="posProducts" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-3 mt-4 max-h-[60vh] overflow-auto scrollbar"></div>
    </div>
    <div class="bg-white border rounded-2xl p-4">
      <div class="flex justify-between items-center"><h2 class="font-bold text-xl">Current Cart</h2><button id="clearCart" class="text-red-600 text-sm">Clear</button></div>
      <div id="cartList" class="mt-3 max-h-[42vh] overflow-auto scrollbar"></div>
      <div class="border-t mt-4 pt-4 space-y-2">
        <div class="flex justify-between"><span>Subtotal</span><b>${money(subtotal)}</b></div>
        <div class="grid grid-cols-2 gap-2"><input id="discount" type="number" min="0" value="0" placeholder="Discount" class="border rounded-lg px-3 py-2"><input id="tax" type="number" min="0" value="0" placeholder="Tax %" class="border rounded-lg px-3 py-2"></div>
        <div class="flex justify-between text-xl font-bold"><span>Total</span><span id="cartTotal">${money(subtotal)}</span></div>
        <input id="customerName" placeholder="Customer name (optional)" class="w-full border rounded-lg px-3 py-2">
        <select id="payment" class="w-full border rounded-lg px-3 py-2"><option>Cash</option><option>Card</option><option>Bank Transfer</option><option>Other</option></select>
        <button id="checkout" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl py-3">Complete Sale</button>
      </div>
    </div>
  </div>`;
}
function renderPOSProducts(){
  const q=($("productSearch")?.value||"").trim().toLowerCase();
  const list=Object.entries(products).filter(([id,p])=>
    !q || id.toLowerCase().includes(q)||(p.name||"").toLowerCase().includes(q)||(p.barcode||"").toLowerCase().includes(q)
  ).slice(0,60);
  $("posProducts").innerHTML=list.length?list.map(([id,p])=>`
    <button data-add="${esc(id)}" class="text-left border rounded-xl p-3 hover:border-indigo-500 hover:bg-indigo-50 disabled:opacity-50" ${Number(p.stock||0)<=0?"disabled":""}>
      <div class="font-semibold truncate">${esc(p.name||"Unnamed")}</div>
      <div class="text-xs text-slate-500 mt-1">${esc(p.category||"General")} · ID ${esc(id)}</div>
      <div class="flex justify-between mt-2"><b>${money(p.price)}</b><span class="${Number(p.stock||0)<=5?"text-red-600":"text-emerald-600"}">Stock ${Number(p.stock||0)}</span></div>
    </button>`).join(""):emptyState("No products found","Add products from Products & Inventory.");
  document.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>addToCart(b.dataset.add));
}
function addToCart(id){
  const p=products[id]; if(!p)return;
  if(Number(p.stock||0)<=0){toast("Out of stock","err");return}
  const x=cart.find(i=>i.id===id);
  if(x){if(x.qty+1>Number(p.stock||0)){toast("Not enough stock","err");return}x.qty++}
  else cart.push({id,name:p.name||"Unnamed",price:Number(p.price||0),qty:1});
  renderCart();
}
function renderCart(){
  const box=$("cartList"); if(!box)return;
  box.innerHTML=cart.length?cart.map((i,n)=>`<div class="flex gap-2 items-center border-b py-3">
    <div class="flex-1 min-w-0"><div class="font-semibold truncate">${esc(i.name)}</div><div class="text-xs text-slate-500">${money(i.price)} × ${i.qty}</div></div>
    <button data-dec="${n}" class="px-2 py-1 rounded bg-slate-100">−</button><span>${i.qty}</span><button data-inc="${n}" class="px-2 py-1 rounded bg-slate-100">+</button><button data-del="${n}" class="text-red-600 px-2">×</button>
  </div>`).join(""):emptyState("Cart is empty","Add a product to begin.");
  document.querySelectorAll("[data-inc]").forEach(b=>b.onclick=()=>{const i=cart[+b.dataset.inc],p=products[i.id];if(i.qty<Number(p.stock||0))i.qty++;else toast("Not enough stock","err");renderCart()});
  document.querySelectorAll("[data-dec]").forEach(b=>b.onclick=()=>{const i=cart[+b.dataset.dec];i.qty--;if(i.qty<=0)cart.splice(+b.dataset.dec,1);renderCart()});
  document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{cart.splice(+b.dataset.del,1);renderCart()});
  const t=totals();$("cartTotal").textContent=money(t.total);
}
async function checkout(){
  if(!cart.length){toast("Cart is empty","err");return}
  const t=totals(), payment=$("payment").value, customerName=$("customerName").value.trim();
  const saleRef=push(ref(db,"sales")), saleId=saleRef.key;
  const updates={};
  try{
    for(const item of cart){
      const pRef=ref(db,"products/"+item.id);
      const result=await runTransaction(pRef,current=>{
        if(current===null) return;
        const stock=Number(current.stock||0);
        if(stock<item.qty) return;
        return {...current,stock:stock-item.qty};
      });
      if(!result.committed){
        toast(`Stock changed for ${item.name}. Sale cancelled.`,"err"); return;
      }
    }
    const invoiceNo="INV-"+Date.now().toString().slice(-8);
    updates["sales/"+saleId]={id:saleId,invoiceNo,timestamp:Date.now(),items:cart.map(x=>({...x})),subtotal:t.subtotal,discount:t.discount,tax:t.tax,taxAmount:t.taxAmt,total:t.total,payment,customerName,adminEmail:auth.currentUser?.email||""};
    if(customerName){
      const cId=Object.keys(customers).find(k=>(customers[k].name||"").toLowerCase()===customerName.toLowerCase());
      if(cId) updates["customers/"+cId+"/lastPurchase"]=Date.now();
      else {const cr=push(ref(db,"customers"));updates["customers/"+cr.key]={name:customerName,lastPurchase:Date.now(),createdAt:Date.now()};}
    }
    await update(ref(db),updates);
    cart=[];toast("Sale completed successfully");
    renderPage();
    printReceipt(updates["sales/"+saleId]);
  }catch(e){toast(e.message,"err")}
}
function printReceipt(s){
  const w=window.open("","_blank","width=420,height=700");
  if(!w){toast("Allow popups to print receipt","err");return}
  const rows=s.items.map(i=>`<tr><td>${esc(i.name)}</td><td>${i.qty}</td><td>${Number(i.price*i.qty).toLocaleString()}</td></tr>`).join("");
  w.document.write(`<html><head><title>${esc(s.invoiceNo)}</title><style>body{font-family:Arial;padding:20px;max-width:360px;margin:auto}h2{text-align:center}table{width:100%;border-collapse:collapse}td{padding:6px 0;border-bottom:1px dashed #ccc}.r{text-align:right}</style></head><body><h2>${esc(settings.storeName)}</h2><div>Invoice: ${esc(s.invoiceNo)}</div><div>${fmtDate(s.timestamp)}</div><hr><table>${rows}</table><hr><p>Subtotal: ${money(s.subtotal)}</p><p>Discount: ${money(s.discount)}</p><p>Tax: ${money(s.taxAmount)}</p><h3 class="r">TOTAL: ${money(s.total)}</h3><p>Payment: ${esc(s.payment)}</p><p>Customer: ${esc(s.customerName||"Walk-in")}</p><p style="text-align:center">Thank you!</p><script>window.onload=()=>window.print()<\/script></body></html>`);
  w.document.close();
}

  const list=Object.entries(products);
  return `<div class="space-y-4">
    <div class="flex flex-col sm:flex-row justify-between gap-3">
      <input id="prodFilter" placeholder="Search product, barcode or category..." class="border rounded-xl px-4 py-3 flex-1">

    </div>
    <div class="bg-white border rounded-2xl overflow-hidden">
      <div class="overflow-auto scrollbar"><table class="w-full min-w-[760px]"><thead class="bg-slate-50"><tr><th class="text-left p-3">Product</th><th class="text-left p-3">ID</th><th class="text-left p-3">Barcode</th><th class="text-left p-3">Price</th><th class="text-left p-3">Stock</th><th class="text-left p-3">Category</th><th class="p-3">Actions</th></tr></thead><tbody id="prodRows"></tbody></table></div>
    </div>
  </div>`;
}
function renderProductRows(){
  const q=($("prodFilter")?.value||"").toLowerCase();
  const list=Object.entries(products).filter(([id,p])=>[id,p.name,p.barcode,p.category].some(v=>String(v||"").toLowerCase().includes(q)));

    <td class="p-3"><div class="font-semibold">${esc(p.name)}</div><div class="text-xs text-slate-500">${esc(p.description||"")}</div></td><td class="p-3 font-mono text-xs">${esc(id)}</td><td class="p-3">${esc(p.barcode||"-")}</td><td class="p-3">${money(p.price)}</td><td class="p-3 font-bold ${Number(p.stock||0)<=Number(p.lowStock||5)?"text-red-600":""}">${Number(p.stock||0)}</td><td class="p-3">${esc(p.category||"General")}</td>
    <td class="p-3"><button data-edit="${esc(id)}" class="text-indigo-600 mr-3">Edit</button><button data-delete="${esc(id)}" class="text-red-600">Delete</button></td></tr>`).join(""):`<tr><td colspan="7">${emptyState("No products","Add your first product.")}</td></tr>`;
  document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>openProductModal(b.dataset.edit));
  document.querySelectorAll("[data-delete]").forEach(b=>b.onclick=()=>deleteProduct(b.dataset.delete));

function openProductModal(id=null){
  editProductId=id; const p=id?products[id]:{};
  const m=document.createElement("div");m.id="productModal";m.className="modal fixed inset-0 z-50 grid place-items-center p-4";
  m.innerHTML=`<div class="bg-white rounded-2xl p-5 w-full max-w-lg max-h-[92vh] overflow-auto">
    <div class="flex justify-between items-center"><h2 class="text-xl font-bold">${id?"Edit Product":"Add Product"}</h2><button id="closePM" class="text-2xl">×</button></div>
    <div class="grid sm:grid-cols-2 gap-3 mt-4">
      <div class="sm:col-span-2"><label class="text-sm">Product Name</label><input id="pName" value="${esc(p.name)}" class="w-full border rounded-lg px-3 py-2 mt-1"></div>
      <div><label class="text-sm">Product ID</label><input id="pId" value="${esc(id||"")}" ${id?"disabled":""} placeholder="Auto if blank" class="w-full border rounded-lg px-3 py-2 mt-1"></div>
      <div><label class="text-sm">Barcode</label><input id="pBarcode" value="${esc(p.barcode)}" class="w-full border rounded-lg px-3 py-2 mt-1"></div>
      <div><label class="text-sm">Price</label><input id="pPrice" type="number" min="0" value="${Number(p.price||0)}" class="w-full border rounded-lg px-3 py-2 mt-1"></div>
      <div><label class="text-sm">Stock</label><input id="pStock" type="number" min="0" value="${Number(p.stock||0)}" class="w-full border rounded-lg px-3 py-2 mt-1"></div>
      <div><label class="text-sm">Category</label><input id="pCategory" value="${esc(p.category||"General")}" class="w-full border rounded-lg px-3 py-2 mt-1"></div>
      <div><label class="text-sm">Low Stock Alert</label><input id="pLow" type="number" min="0" value="${Number(p.lowStock||5)}" class="w-full border rounded-lg px-3 py-2 mt-1"></div>
      <div class="sm:col-span-2"><label class="text-sm">Description</label><textarea id="pDesc" class="w-full border rounded-lg px-3 py-2 mt-1">${esc(p.description||"")}</textarea></div>
    </div>
    <button id="saveProduct" class="w-full mt-5 bg-indigo-600 text-white rounded-xl py-3 font-bold">Save Product</button>
  </div>`;
  document.body.appendChild(m);$("closePM").onclick=()=>m.remove();
  $("saveProduct").onclick=saveProduct;
}
async function saveProduct(){
  const name=$("pName").value.trim();if(!name){toast("Product name required","err");return}
  let id=$("pId").value.trim(); if(!id){const r=push(ref(db,"products"));id=r.key}
  const data={name,barcode:$("pBarcode").value.trim(),price:Number($("pPrice").value||0),stock:Number($("pStock").value||0),category:$("pCategory").value.trim()||"General",lowStock:Number($("pLow").value||5),description:$("pDesc").value.trim(),updatedAt:Date.now()};
  try{await set(ref(db,"products/"+id),data);$("productModal").remove();toast(editProductId?"Product updated":"Product added");editProductId=null}catch(e){toast(e.message,"err")}
}
async function deleteProduct(id){
  if(!confirm("Delete this product?"))return;
  try{await remove(ref(db,"products/"+id));toast("Product deleted")}catch(e){toast(e.message,"err")}
}

function salesHTML(){
  const list=Object.values(sales).sort((a,b)=>(b.timestamp||0)-(a.timestamp||0));
  return `<div class="bg-white border rounded-2xl overflow-hidden"><div class="p-4 border-b flex flex-col sm:flex-row gap-2"><input id="salesFilter" placeholder="Search invoice/customer/payment..." class="border rounded-xl px-4 py-2 flex-1"><button id="exportSales" class="border rounded-xl px-4 py-2">Export CSV</button></div><div class="overflow-auto scrollbar"><table class="w-full min-w-[850px]"><thead class="bg-slate-50"><tr><th class="p-3 text-left">Invoice</th><th class="p-3 text-left">Date</th><th class="p-3 text-left">Customer</th><th class="p-3 text-left">Payment</th><th class="p-3 text-left">Items</th><th class="p-3 text-left">Total</th><th class="p-3">Receipt</th></tr></thead><tbody id="salesRows"></tbody></table></div></div>`;
}
function renderSalesRows(){
  const q=($("salesFilter")?.value||"").toLowerCase();
  const list=Object.values(sales).sort((a,b)=>(b.timestamp||0)-(a.timestamp||0)).filter(s=>[s.invoiceNo,s.customerName,s.payment].some(v=>String(v||"").toLowerCase().includes(q)));
  $("salesRows").innerHTML=list.length?list.map(s=>`<tr class="border-t"><td class="p-3 font-semibold">${esc(s.invoiceNo)}</td><td class="p-3 text-sm">${fmtDate(s.timestamp)}</td><td class="p-3">${esc(s.customerName||"Walk-in")}</td><td class="p-3">${esc(s.payment)}</td><td class="p-3">${(s.items||[]).reduce((a,i)=>a+Number(i.qty||0),0)}</td><td class="p-3 font-bold">${money(s.total)}</td><td class="p-3"><button data-receipt="${esc(s.id)}" class="text-indigo-600">Print</button></td></tr>`).join(""):`<tr><td colspan="7">${emptyState("No sales","Sales will appear here after checkout.")}</td></tr>`;
  document.querySelectorAll("[data-receipt]").forEach(b=>b.onclick=()=>printReceipt(sales[b.dataset.receipt]));
}
function customersHTML(){
  const list=Object.entries(customers).sort((a,b)=>(b[1].lastPurchase||0)-(a[1].lastPurchase||0));
  return `<div class="bg-white border rounded-2xl overflow-hidden"><div class="p-4 border-b flex justify-between"><h2 class="font-bold">Customers</h2><button id="addCustomer" class="bg-indigo-600 text-white rounded-xl px-4 py-2">＋ Add</button></div><div class="overflow-auto"><table class="w-full min-w-[650px]"><thead class="bg-slate-50"><tr><th class="p-3 text-left">Name</th><th class="p-3 text-left">Phone</th><th class="p-3 text-left">Address</th><th class="p-3 text-left">Last Purchase</th><th class="p-3">Actions</th></tr></thead><tbody id="customerRows"></tbody></table></div></div>`;
}
function renderCustomerRows(){
  const list=Object.entries(customers);
  $("customerRows").innerHTML=list.length?list.map(([id,c])=>`<tr class="border-t"><td class="p-3 font-semibold">${esc(c.name)}</td><td class="p-3">${esc(c.phone||"-")}</td><td class="p-3">${esc(c.address||"-")}</td><td class="p-3">${c.lastPurchase?fmtDate(c.lastPurchase):"-"}</td><td class="p-3"><button data-ce="${esc(id)}" class="text-indigo-600 mr-3">Edit</button><button data-cd="${esc(id)}" class="text-red-600">Delete</button></td></tr>`).join(""):`<tr><td colspan="5">${emptyState("No customers","Add customers for faster checkout.")}</td></tr>`;
  document.querySelectorAll("[data-ce]").forEach(b=>b.onclick=()=>openCustomerModal(b.dataset.ce));
  document.querySelectorAll("[data-cd]").forEach(b=>b.onclick=async()=>{if(confirm("Delete customer?"))await remove(ref(db,"customers/"+b.dataset.cd))});
}
function openCustomerModal(id=null){
  const c=id?customers[id]:{};const m=document.createElement("div");m.id="customerModal";m.className="modal fixed inset-0 z-50 grid place-items-center p-4";
  m.innerHTML=`<div class="bg-white rounded-2xl p-5 w-full max-w-md"><div class="flex justify-between"><h2 class="text-xl font-bold">${id?"Edit":"Add"} Customer</h2><button id="closeCM" class="text-2xl">×</button></div><input id="cName" placeholder="Name" value="${esc(c.name)}" class="w-full border rounded-lg px-3 py-2 mt-4"><input id="cPhone" placeholder="Phone" value="${esc(c.phone)}" class="w-full border rounded-lg px-3 py-2 mt-3"><textarea id="cAddress" placeholder="Address" class="w-full border rounded-lg px-3 py-2 mt-3">${esc(c.address||"")}</textarea><button id="saveCustomer" class="w-full mt-4 bg-indigo-600 text-white rounded-xl py-3 font-bold">Save</button></div>`;
  document.body.appendChild(m);$("closeCM").onclick=()=>m.remove();$("saveCustomer").onclick=async()=>{const name=$("cName").value.trim();if(!name){toast("Name required","err");return}const cid=id||push(ref(db,"customers")).key;await set(ref(db,"customers/"+cid),{name,phone:$("cPhone").value.trim(),address:$("cAddress").value.trim(),lastPurchase:c.lastPurchase||0,createdAt:c.createdAt||Date.now()});m.remove();toast("Customer saved")};
}

function reportsHTML(){
  const arr=Object.values(sales), revenue=arr.reduce((a,s)=>a+Number(s.total||0),0), items=arr.reduce((a,s)=>a+(s.items||[]).reduce((x,i)=>x+Number(i.qty||0),0),0);
  const byPayment={};arr.forEach(s=>byPayment[s.payment]=(byPayment[s.payment]||0)+Number(s.total||0));
  const top={};arr.forEach(s=>(s.items||[]).forEach(i=>top[i.name]=(top[i.name]||0)+Number(i.qty||0)));
  const tops=Object.entries(top).sort((a,b)=>b[1]-a[1]).slice(0,10);
  return `<div class="space-y-5"><div class="grid sm:grid-cols-3 gap-3">${card("Total Revenue",money(revenue),"💰")}${card("Total Orders",arr.length,"🧾")}${card("Items Sold",items,"📦")}</div><div class="grid lg:grid-cols-2 gap-5"><div class="bg-white border rounded-2xl p-5"><h2 class="font-bold text-lg">Payment Breakdown</h2>${Object.entries(byPayment).map(([k,v])=>`<div class="flex justify-between border-b py-3"><span>${esc(k)}</span><b>${money(v)}</b></div>`).join("")||emptyState("No data","Complete sales to see reports.")}</div><div class="bg-white border rounded-2xl p-5"><h2 class="font-bold text-lg">Top Products</h2>${tops.map(([k,v])=>`<div class="flex justify-between border-b py-3"><span>${esc(k)}</span><b>${v}</b></div>`).join("")||emptyState("No data","Product sales will appear here.")}</div></div></div>`;
}
function settingsHTML(){
  return `<div class="max-w-2xl bg-white border rounded-2xl p-5"><h2 class="text-xl font-bold">Store Settings</h2><p class="text-sm text-slate-500 mt-1">These settings are stored in Firebase.</p><div class="space-y-4 mt-5"><div><label class="text-sm font-semibold">Store Name</label><input id="storeName" value="${esc(settings.storeName)}" class="w-full border rounded-lg px-3 py-2 mt-1"></div><div><label class="text-sm font-semibold">Currency</label><input id="currency" value="${esc(settings.currency||"Rs")}" class="w-full border rounded-lg px-3 py-2 mt-1"></div><div><label class="text-sm font-semibold">Phone</label><input id="storePhone" value="${esc(settings.phone||"")}" class="w-full border rounded-lg px-3 py-2 mt-1"></div><button id="saveSettings" class="bg-indigo-600 text-white rounded-xl px-5 py-3 font-bold">Save Settings</button></div></div>`;
}
function bindPage(){
  if(currentPage==="dashboard"){
    document.querySelectorAll("[data-nav]").forEach(b=>b.onclick=()=>{currentPage=b.dataset.nav;renderNav();renderPage()});
  }
  if(currentPage==="pos"){
    $("productSearch").oninput=renderPOSProducts;$("productSearch").onkeydown=e=>{if(e.key==="Enter"){$("scanAdd").click()}};
    $("scanAdd").onclick=()=>{const q=$("productSearch").value.trim().toLowerCase();const found=Object.entries(products).find(([id,p])=>id.toLowerCase()===q||(p.barcode||"").toLowerCase()===q||(p.name||"").toLowerCase()===q);if(found){addToCart(found[0]);$("productSearch").value="";renderPOSProducts()}else toast("Product not found","err")};
    $("clearCart").onclick=()=>{cart=[];renderCart()};$("discount").oninput=renderCart;$("tax").oninput=renderCart;$("checkout").onclick=checkout;renderPOSProducts();renderCart();
  }
  if(currentPage==="products"){$("prodFilter").oninput=renderProductRows;$("addProduct").onclick=()=>openProductModal();renderProductRows()}
  if(currentPage==="sales"){$("salesFilter").oninput=renderSalesRows;$("exportSales").onclick=exportSales;renderSalesRows()}
  if(currentPage==="customers"){$("addCustomer").onclick=()=>openCustomerModal();renderCustomerRows()}
  if(currentPage==="settings")$("saveSettings").onclick=async()=>{settings={storeName:$("storeName").value.trim()||"TopSoft POS",currency:$("currency").value.trim()||"Rs",phone:$("storePhone").value.trim()};await set(ref(db,"settings"),settings);toast("Settings saved");renderNav()};
}
function exportSales(){
  const rows=[["Invoice","Date","Customer","Payment","Total"]];
  Object.values(sales).sort((a,b)=>(a.timestamp||0)-(b.timestamp||0)).forEach(s=>rows.push([s.invoiceNo,fmtDate(s.timestamp),s.customerName||"Walk-in",s.payment,s.total]));
  const csv=rows.map(r=>r.map(x=>`"${String(x).replace(/"/g,'""')}"`).join(",")).join("\\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="topsoft-pos-sales.csv";a.click();URL.revokeObjectURL(a.href);
}

function startData(){
  unsubscribeFns.forEach(f=>f&&f());unsubscribeFns=[];
  unsubscribeFns.push(onValue(ref(db,"products"),s=>{products=s.val()||{};if(currentPage==="products")renderProductRows();if(currentPage==="pos")renderPOSProducts();if(currentPage==="dashboard")renderPage()}));
  unsubscribeFns.push(onValue(ref(db,"sales"),s=>{sales=s.val()||{};if(currentPage==="sales")renderSalesRows();if(currentPage==="dashboard"||currentPage==="reports")renderPage()}));
  unsubscribeFns.push(onValue(ref(db,"customers"),s=>{customers=s.val()||{};if(currentPage==="customers")renderCustomerRows()}));
  unsubscribeFns.push(onValue(ref(db,"settings"),s=>{settings={...settings,...(s.val()||{})};if($("pageTitle"))renderPage()}));
}
onAuthStateChanged(auth,user=>{
  if(user){
    if((user.email||"").toLowerCase()!==ALLOWED_EMAIL){signOut(auth);alert("Unauthorized account.");return}
    shell();startData();
  }else{login()}
});
</script>
